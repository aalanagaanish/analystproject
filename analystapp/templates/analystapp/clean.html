<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AnalystApp | Data Cleaner</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;

            background-color:#0f172a;
            background-image:
            radial-gradient(at 0% 0%, rgba(30,58,138,0.3) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(15,23,42,1) 0px, transparent 50%);

            color:#f8fafc;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            top:0;
            left:0;
            opacity:0.03;
            pointer-events:none;

            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .container{
            width:100%;
            max-width:550px;

            background:#1e293b;

            padding:45px 40px;

            border-radius:18px;

            border:1px solid rgba(255,255,255,0.08);

            box-shadow:
            0 20px 25px -5px rgba(0,0,0,0.3),
            0 10px 10px -5px rgba(0,0,0,0.2);

            position:relative;
            z-index:10;

            animation:fadeIn 0.6s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .accent-bar{
            width:45px;
            height:4px;
            background:#f87171;
            margin:0 auto 20px;
            border-radius:2px;
        }

        h1{
            text-align:center;
            font-size:2rem;
            margin-bottom:10px;
            color:#ffffff;
        }

        .subtitle{
            text-align:center;
            color:#94a3b8;
            margin-bottom:35px;
            font-size:0.95rem;
        }

        form{
            width:100%;
        }

        .form-group{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:8px;

            font-size:0.9rem;
            font-weight:600;

            color:#cbd5e1;
        }

        input[type="file"],
        input[type="text"],
        select{

            width:100%;
            padding:14px 16px;

            border-radius:10px;

            border:1px solid #334155;

            background:#0f172a;

            color:white;

            outline:none;

            transition:0.3s;
        }

        input:focus,
        select:focus{

            border-color:#f87171;

            box-shadow:
            0 0 0 3px rgba(248,113,113,0.15);
        }

        input[type="file"]{
            cursor:pointer;
        }

        button{
            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#f87171;

            color:white;

            font-size:16px;
            font-weight:700;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#ef4444;

            transform:translateY(-2px);

            box-shadow:
            0 10px 15px -3px rgba(239,68,68,0.3);
        }

        .success{
            margin-top:20px;
            padding:14px;

            background:rgba(34,197,94,0.1);

            border:1px solid rgba(34,197,94,0.2);

            color:#4ade80;

            border-radius:8px;

            text-align:center;
        }

        .error{
            margin-top:20px;
            padding:14px;

            background:rgba(239,68,68,0.1);

            border:1px solid rgba(239,68,68,0.2);

            color:#f87171;

            border-radius:8px;

            text-align:center;
        }

        .back-link{

            display:block;

            text-align:center;

            margin-top:25px;

            text-decoration:none;

            color:#94a3b8;

            font-size:0.9rem;

            transition:0.3s;
        }

        .back-link:hover{
            color:#ffffff;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="accent-bar"></div>

    <h1>Data Cleaner</h1>

    <p class="subtitle">
        Upload your dataset and automatically clean missing values,
        duplicates, and formatting issues.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-group">

            <label>
                Upload CSV or Excel Dataset
            </label>

            <input type="file"
                   name="dataset"
                   accept=".csv,.xlsx,.xls"
                   required>

        </div>

        <div class="form-group">

            <label>
                Target Column Name (Optional)
            </label>

            <input type="text"
                   name="column"
                   placeholder="Example: Age, Salary, City">

        </div>

        <div class="form-group">

            <label>
                Convert Column Datatype
            </label>

            <select name="datatype">

                <option value="">
                    Detect Automatically
                </option>

                <option value="int">
                    Integer
                </option>

                <option value="float">
                    Float
                </option>

                <option value="str">
                    String
                </option>

            </select>

        </div>

        <button type="submit">

            Clean Dataset

        </button>

    </form>

    <a href="{% url 'home' %}"
       class="back-link">

        ← Return Home

    </a>

</div>

</body>
</html>
