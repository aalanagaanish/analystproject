<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Arial,sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background-color:#0f172a;

            background-image:
            radial-gradient(at 0% 0%, rgba(30,58,138,0.25) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(15,23,42,1) 0px, transparent 50%);

            color:white;
        }

        .box{

            width:400px;

            background:#1e293b;

            padding:45px;

            border-radius:18px;

            border:1px solid rgba(255,255,255,0.06);

            box-shadow:
            0 20px 40px rgba(0,0,0,0.35);
        }

        .accent-bar{

            width:45px;
            height:4px;

            background:#38bdf8;

            border-radius:3px;

            margin-bottom:20px;
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#94a3b8;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box input{

            width:100%;

            padding:14px;

            border:none;

            outline:none;

            border-radius:10px;

            background:#0f172a;

            color:white;

            border:1px solid #334155;
        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#38bdf8;

            font-weight:bold;

            cursor:pointer;
        }

        .error-msg{

            background:rgba(239,68,68,0.1);

            color:#f87171;

            padding:12px;

            border-radius:10px;

            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="accent-bar"></div>

    <h1>Verify OTP</h1>

    <p>
        Enter the OTP sent to your email.
    </p>

    {% if error %}

    <div class="error-msg">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">

            <input type="text"
                   name="otp"
                   placeholder="Enter OTP"
                   required>

        </div>

        <button type="submit">

            Verify OTP

        </button>

    </form>

</div>

</body>
</html>
